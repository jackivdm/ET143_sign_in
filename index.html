<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>ET143 A1 Sign in</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    :root {
      --bg: #111827;
      --card: #1f2937;
      --text: #ffffff;
      --muted: #9ca3af;
      --primary: #0b5ed7;
      --secondary: #475569;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #f59e0b;
      --border: #374151;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);

      font-family:
        system-ui,
        -apple-system,
        Segoe UI,
        Roboto,
        Arial,
        sans-serif;
    }

    body {
      padding:
        max(12px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    .view {
      display: none;
    }

    .view.active {

    }

    h1 {
      margin: 6px 0 10px;
      text-align: center;
      font-size: 24px;
    }

    h2 {
      margin: 4px 0 14px;
      text-align: center;
      font-size: 21px;
    }

    .subtitle {
      margin-bottom: 20px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
      line-height: 1.4;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 14px;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 13px;

      border: none;
      border-radius: 12px;

      font-size: 16px;
      font-weight: 700;

      color: white;
      background: var(--primary);

      cursor: pointer;
    }

    button:active {
      transform: translateY(1px);
    }

    button.secondary {
      background: var(--secondary);
    }

    button.large {
      padding: 18px;
      font-size: 18px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: 700;
      font-size: 14px;
    }

    input {
      width: 100%;
      margin-top: 6px;
      padding: 13px;

      border: 1px solid var(--border);
      border-radius: 10px;

      background: #ffffff;
      color: #111827;

      font-size: 18px;
      outline: none;
    }

    input:focus {
      border-color: #60a5fa;
    }

    .status {
      margin-top: 10px;
      padding: 10px;

      border-radius: 10px;

      background: var(--card);

      text-align: center;
      font-size: 14px;
    }

    .status.warning {
      background: #78350f;
    }

    .status.error {
      background: #7f1d1d;
    }

    .status.success {
      background: #166534;
    }


    /* =========================================
       HOME
       ========================================= */

    #landingView {
      padding-top: 30px;
    }

    .landing-card {
      padding: 18px;
    }


    /* =========================================
       COUNTERS
       ========================================= */

    .counters {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .counter {
      flex: 1;

      background: var(--card);

      border-radius: 12px;
      padding: 10px;

      text-align: center;
    }

    .counter-label {
      color: var(--muted);

      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .counter-number {
      margin-top: 2px;

      font-size: 30px;
      font-weight: 800;

      line-height: 1;
    }

    #savedCounter {
      color: #86efac;
    }


    /* =========================================
       SCAN CONFIRMATION
       ========================================= */

    #confirmation {
      height: 68px;

      margin-bottom: 10px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: var(--card);

      border-radius: 12px;

      font-size: 24px;
      font-weight: 800;

      text-align: center;

      transition:
        background-color .15s ease,
        transform .15s ease;
    }

    #confirmation.success {
      background: var(--success);
      transform: scale(1.02);
    }


    /* =========================================
       CAMERA
       ========================================= */

    #readerContainer {
      position: relative;

      width: 100%;

      background: #000;

      border-radius: 14px;
      overflow: hidden;
    }

    #reader {
      width: 100%;
    }

    #scanFlash {
      position: absolute;
      inset: 0;

      display: none;

      background: rgba(22, 163, 74, .35);

      pointer-events: none;

      z-index: 100;
    }

    #scanFlash.show {
      display: block;
    }


    /* =========================================
       RECENT ENTRIES
       ========================================= */

    .recent {
      margin-top: 10px;

      background: var(--card);

      border-radius: 12px;
      padding: 10px;
    }

    .recent-title {
      margin-bottom: 6px;

      color: var(--muted);

      font-size: 12px;
      font-weight: 700;

      text-align: center;
      letter-spacing: .5px;
    }

    #recentList {
      margin: 0;
      padding: 0;

      list-style: none;
    }

    #recentList li {
      display: flex;
      justify-content: space-between;
      gap: 10px;

      padding: 6px 4px;

      border-top:
        1px solid rgba(255, 255, 255, .08);

      font-size: 14px;
    }

    .saved {
      color: #86efac;
    }

    .waiting {
      color: #fbbf24;
    }


    /* =========================================
       MANUAL ENTRY
       ========================================= */

    .manual-wrap {
      margin-top: 16px;
    }

    #manualConfirmation {
      margin-top: 12px;
      min-height: 48px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 10px;

      background: #111827;

      text-align: center;
      font-weight: 700;
    }

    #manualConfirmation.success {
      background: var(--success);
    }

    #manualConfirmation.error {
      background: #7f1d1d;
    }

    #manualQueueStatus {
      margin-top: 10px;

      color: var(--muted);

      text-align: center;
      font-size: 13px;
    }
  </style>
</head>


<body>

<div class="container">


  <!-- ==================================================
       HOME
       ================================================== -->

  <div
    id="landingView"
    class="view active"
  >

    <h1>ET143 A1 Sign in</h1>

    <div class="subtitle">

    </div>


    <div class="card landing-card">

      <button
        class="large"

      </button>


      <button

      </button>

  <!-- ==================================================

       ================================================== -->

  <div

  >

    <h2>Rapid Card Scanner</h2>


    <div class="counters">

      <div class="counter">

        <div class="counter-label">

        </div>

        <div
          id="scannedCounter"

        </div>

      </div>


      <div class="counter">

        <div class="counter-label">
          SAVED
        </div>

        <div
          id="savedCounter"
          class="counter-number"

          0

    </div>


    <div id="confirmation">

    </div>


    <div id="readerContainer">

      <div id="reader"></div>

      <div id="scanFlash"></div>

    <div

    >

    </div>


    <button
      id="startButton"

      onclick="startScanner()"

    <button
      id="stopButton"
      class="secondary"
      type="button"
      style="display:none"
      onclick="stopScanner()"
    >
      Stop Scanner
    </button>


    <button
      class="secondary"
      type="button"
      onclick="goToManual()"
    >
      Manual Entry
    </button>


    <button
      class="secondary"
      type="button"
      onclick="goHome()"
    >
      Back to Home
    </button>


    <div class="recent">

      <div class="recent-title">
        RECENT ENTRIES
      </div>

      <ul id="recentList"></ul>

    </div>

  </div>



  <!-- ==================================================
       MANUAL ENTRY
       ================================================== -->

  <div
    id="manualView"
    class="view"
  >

    <h2>Manual Entry</h2>


    <div class="card manual-wrap">

      <label for="manualStudentNumber">
        Student Number
      </label>


      <input
        id="manualStudentNumber"
        type="text"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="8"
        autocomplete="off"
        placeholder="8-digit student number"
      >


      <button
        type="button"
        onclick="saveManualEntry()"
      >
        Save Student
      </button>


      <button
        class="secondary"
        type="button"
        onclick="goToScanner()"
      >
        Rapid Card Scanner
      </button>


      <button
        class="secondary"
        type="button"
        onclick="goHome()"
      >
        Back to Home
      </button>


      <div id="manualConfirmation">
        Ready
      </div>


      <div id="manualQueueStatus">
      </div>

    </div>

  </div>


</div>



<script>

  // ==================================================
  // CONFIGURATION
  // ==================================================

  /*
    Replace this with your Apps Script Web App URL.

    IMPORTANT:
    It must end in /exec
  */

  const API_URL =
    "https://script.google.com/macros/s/AKfycbzQJvyy7VfBTqBIsw0u7bejiVkoT6b_DYmGlt1MrjYWnm_jYOO6USjTCl1K6Gm0E5c9WA/exec";


  /*
    Ignore the SAME valid student number for
    2 seconds.

    A different student card can still be
    scanned immediately.
  */

  const DUPLICATE_LOCK_MS =
    2000;


  /*
    Maximum number of entries uploaded
    in one request.
  */

  const BATCH_SIZE =
    10;


  /*
    Retry unsaved entries every 2 seconds.
  */

  const RETRY_INTERVAL_MS =
    2000;



  // ==================================================
  // STUDENT NUMBER VALIDATION
  // ==================================================

  /*
    A valid student number must:

    1. Be exactly 8 digits
    2. Start with 1, 2 or 3
    3. Pass the modulus-11 checksum


    CHECKSUM:

    Position:  1 2 3 4 5 6 7 8
    Weight:    8 7 6 5 4 3 2 1

    Multiply each digit by its weight.

    Add the results.

    The total must be exactly divisible by 11.


    Example:

    29062454

    2×8 = 16
    9×7 = 63
    0×6 =  0
    6×5 = 30
    2×4 =  8
    4×3 = 12
    5×2 = 10
    4×1 =  4

    Total = 143

    143 % 11 = 0

    VALID
  */

  function isValidStudentNumber(
    value
  ) {

    const studentNumber =
      String(
        value || ""
      ).trim();



    /*
      First check:

      exactly 8 numeric digits
      starting with 1, 2 or 3
    */

    if (
      !/^[123]\d{7}$/.test(
        studentNumber
      )
    ) {

      return false;

    }



    /*
      Modulus-11 checksum.
    */

    const weights =
      [8, 7, 6, 5, 4, 3, 2, 1];


    let total =
      0;


    for (
      let i = 0;
      i < 8;
      i++
    ) {

      total +=
        Number(
          studentNumber[i]
        ) *
        weights[i];

    }



    /*
      Valid only when the weighted total
      is exactly divisible by 11.
    */

    return (
      total % 11 === 0
    );

  }



  // ==================================================
  // PAGE ELEMENTS
  // ==================================================

  const landingView =
    document.getElementById(
      "landingView"
    );

  const scannerView =
    document.getElementById(
      "scannerView"
    );

  const manualView =
    document.getElementById(
      "manualView"
    );


  const scannedCounterEl =
    document.getElementById(
      "scannedCounter"
    );

  const savedCounterEl =
    document.getElementById(
      "savedCounter"
    );

  const confirmationEl =
    document.getElementById(
      "confirmation"
    );

  const queueStatusEl =
    document.getElementById(
      "queueStatus"
    );

  const recentListEl =
    document.getElementById(
      "recentList"
    );

  const scanFlashEl =
    document.getElementById(
      "scanFlash"
    );

  const startButton =
    document.getElementById(
      "startButton"
    );

  const stopButton =
    document.getElementById(
      "stopButton"
    );

  const manualStudentNumber =
    document.getElementById(
      "manualStudentNumber"
    );

  const manualConfirmation =
    document.getElementById(
      "manualConfirmation"
    );

  const manualQueueStatus =
    document.getElementById(
      "manualQueueStatus"
    );



  // ==================================================
  // STATE
  // ==================================================

  let scanner =
    null;

  let uploadInProgress =
    false;

  let recentBarcodes =
    {};

  let audioContext =
    null;

  let scannedCount =
    0;

  let savedCount =
    0;



  // ==================================================
  // RECOVER UNSAVED QUEUE
  // ==================================================

  let uploadQueue =
    [];


  try {

    uploadQueue =
      JSON.parse(
        localStorage.getItem(
          "ET143_uploadQueue"
        )
      ) || [];

  }

  catch (error) {

    uploadQueue =
      [];

  }



  // ==================================================
  // LOCAL STORAGE
  // ==================================================

  function saveQueueLocally() {

    try {

      localStorage.setItem(
        "ET143_uploadQueue",
        JSON.stringify(
          uploadQueue
        )
      );

    }

    catch (error) {

      console.error(
        "Could not save local queue:",
        error
      );

    }

  }



  // ==================================================
  // AUDIO
  // ==================================================

  function primeAudio() {

    try {

      if (!audioContext) {

        audioContext =
          new (
            window.AudioContext ||
            window.webkitAudioContext
          )();

      }


      if (
        audioContext.state ===
        "suspended"
      ) {

        audioContext.resume();

      }

    }

    catch (error) {

      console.log(
        "Audio unavailable."
      );

    }

  }



  function playBeep() {

    try {

      if (!audioContext) {

        audioContext =
          new (
            window.AudioContext ||
            window.webkitAudioContext
          )();

      }


      if (
        audioContext.state ===
        "suspended"
      ) {

        audioContext.resume();

      }


      const oscillator =
        audioContext
          .createOscillator();


      const gain =
        audioContext
          .createGain();


      oscillator.connect(
        gain
      );


      gain.connect(
        audioContext.destination
      );


      oscillator.frequency.value =
        1100;


      gain.gain.value =
        0.15;


      oscillator.start();


      oscillator.stop(
        audioContext.currentTime +
        0.09
      );

    }

    catch (error) {

      console.log(
        "Audio unavailable."
      );

    }

  }



  // ==================================================
  // NAVIGATION
  // ==================================================

  function showView(
    view
  ) {

    landingView.classList.remove(
      "active"
    );

    scannerView.classList.remove(
      "active"
    );

    manualView.classList.remove(
      "active"
    );


    view.classList.add(
      "active"
    );

  }



  async function goHome() {

    await stopScanner();


    showView(
      landingView
    );

  }



  async function goToManual() {

    primeAudio();


    await stopScanner();


    showView(
      manualView
    );


    manualConfirmation.textContent =
      "Ready";


    manualConfirmation.className =
      "";


    updateManualQueueStatus();


    setTimeout(
      () => {

        manualStudentNumber.focus();

      },
      100
    );

  }



  async function goToScanner() {

    primeAudio();


    showView(
      scannerView
    );


    await startScanner();

  }



  // ==================================================
  // COUNTERS
  // ==================================================

  function updateCounters() {

    scannedCounterEl.textContent =
      scannedCount;


    savedCounterEl.textContent =
      savedCount;

  }



  // ==================================================
  // QUEUE STATUS
  // ==================================================

  function updateQueueStatus() {

    const waiting =
      uploadQueue.length;


    queueStatusEl.className =
      "status";


    if (
      waiting === 0
    ) {

      queueStatusEl.textContent =
        "All entries saved ✔";


      queueStatusEl.classList.add(
        "success"
      );

    }

    else {

      queueStatusEl.textContent =
        waiting +
        (
          waiting === 1
            ? " entry waiting to upload"
            : " entries waiting to upload"
        );


      queueStatusEl.classList.add(
        "warning"
      );

    }


    updateManualQueueStatus();

  }



  function updateManualQueueStatus() {

    const waiting =
      uploadQueue.length;


    if (
      waiting === 0
    ) {

      manualQueueStatus.textContent =
        "All entries saved ✔";

    }

    else {

      manualQueueStatus.textContent =
        waiting +
        (
          waiting === 1
            ? " entry waiting to upload"
            : " entries waiting to upload"
        );

    }

  }



  // ==================================================
  // BARCODE SCAN BOX
  // ==================================================

  function computeScanBox(
    viewfinderWidth,
    viewfinderHeight
  ) {

    const width =
      Math.min(
        420,
        Math.floor(
          viewfinderWidth * 0.90
        )
      );


    const height =
      Math.max(
        55,
        Math.floor(
          width / 5.2
        )
      );


    return {
      width: width,
      height: height
    };

  }



  // ==================================================
  // START SCANNER
  // ==================================================

  async function startScanner() {

    if (scanner) {
      return;
    }


    primeAudio();


    confirmationEl.textContent =
      "Starting camera…";


    const newScanner =
      new Html5Qrcode(
        "reader"
      );


    scanner =
      newScanner;


    try {

      await newScanner.start(

        {
          facingMode:
            "environment"
        },

        {

          fps: 20,

          qrbox:
            computeScanBox,

          videoConstraints: {

            facingMode:
              "environment",

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }

          },

          experimentalFeatures: {

            useBarCodeDetectorIfSupported:
              true

          }

        },

        onScanSuccess

      );


      if (
        scanner !== newScanner
      ) {

        try {

          await newScanner.stop();

        }

        catch (error) {}


        try {

          newScanner.clear();

        }

        catch (error) {}


        return;

      }


      confirmationEl.textContent =
        "Ready to scan";


      startButton.style.display =
        "none";


      stopButton.style.display =
        "block";


      updateQueueStatus();

    }

    catch (error) {

      console.error(
        "Camera error:",
        error
      );


      if (
        scanner === newScanner
      ) {

        scanner =
          null;

      }


      confirmationEl.textContent =
        "Camera failed";


      queueStatusEl.textContent =
        "Could not start camera";


      queueStatusEl.className =
        "status error";


      startButton.style.display =
        "block";


      stopButton.style.display =
        "none";

    }

  }



  // ==================================================
  // STOP SCANNER
  // ==================================================

  async function stopScanner() {

    if (!scanner) {
      return;
    }


    const activeScanner =
      scanner;


    scanner =
      null;


    try {

      await activeScanner.stop();

    }

    catch (error) {

      console.log(
        "Scanner already stopped."
      );

    }


    try {

      activeScanner.clear();

    }

    catch (error) {}


    startButton.style.display =
      "block";


    stopButton.style.display =
      "none";


    confirmationEl.textContent =
      "Scanner stopped";

  }



  // ==================================================
  // SUCCESSFUL BARCODE DECODE
  // ==================================================

  function onScanSuccess(
    decodedText
  ) {

    const barcode =
      String(
        decodedText || ""
      ).trim();



    /*
      IMPORTANT:

      html5-qrcode may decode many different
      barcode formats.

      We do not assume which barcode format
      the university card uses.

      Instead, we validate the RESULT.

      If the decoded value does not satisfy
      the student-number rules, it is silently
      ignored.
    */

    if (
      !isValidStudentNumber(
        barcode
      )
    ) {

      return;

    }



    const now =
      Date.now();



    /*
      TWO-SECOND SAME-NUMBER LOCKOUT.

      This only prevents the same card from
      being accepted repeatedly while it remains
      in front of the camera.

      A different valid card can be scanned
      immediately.
    */

    if (
      recentBarcodes[barcode] &&
      now -
      recentBarcodes[barcode]
      < DUPLICATE_LOCK_MS
    ) {

      return;

    }


    recentBarcodes[barcode] =
      now;



    /*
      Clean old duplicate-lock entries.
    */

    for (
      const code in recentBarcodes
    ) {

      if (
        now -
        recentBarcodes[code]
        > 10000
      ) {

        delete recentBarcodes[
          code
        ];

      }

    }



    /*
      The number has now passed:

      ✓ 8-digit check
      ✓ first-digit check
      ✓ modulus-11 checksum
      ✓ 2-second same-card check

      Accept it.
    */

    acceptEntry(
      barcode,
      "Barcode"
    );


    showSuccessfulScan(
      barcode
    );

  }



  // ==================================================
  // ACCEPT ENTRY
  // ==================================================

  function acceptEntry(
    studentNumber,
    method
  ) {

    const entry = {

      studentNumber:
        String(
          studentNumber
        ).trim(),

      method:
        method

    };


    uploadQueue.push(
      entry
    );


    /*
      SCANNED increases immediately.

      We do NOT wait for Google Sheets.
    */

    scannedCount++;


    saveQueueLocally();


    updateCounters();


    addRecentEntry(
      entry
    );


    updateQueueStatus();



    /*
      Start background upload.

      Scanner remains free for the next card.
    */

    processUploadQueue();

  }



  // ==================================================
  // MANUAL ENTRY
  // ==================================================

  function saveManualEntry() {

    primeAudio();


    const studentNumber =
      manualStudentNumber
        .value
        .trim();



    /*
      Manual entries use exactly the same
      validation as barcode scans.

      This also catches typing mistakes.
    */

    if (
      !isValidStudentNumber(
        studentNumber
      )
    ) {

      manualConfirmation.textContent =
        "Invalid student number";


      manualConfirmation.className =
        "error";


      return;

    }



    acceptEntry(
      studentNumber,
      "Manual"
    );


    manualConfirmation.textContent =
      "✓ " +
      studentNumber;


    manualConfirmation.className =
      "success";


    manualStudentNumber.value =
      "";


    playBeep();


    if (
      navigator.vibrate
    ) {

      navigator.vibrate(
        80
      );

    }



    setTimeout(
      () => {

        manualConfirmation.textContent =
          "Ready";


        manualConfirmation.className =
          "";


        manualStudentNumber.focus();

      },
      700
    );

  }



  /*
    Pressing Enter saves the manual entry.
  */

  manualStudentNumber.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();


        saveManualEntry();

      }

    }
  );



  /*
    Manual input:

    Remove non-numeric characters and
    prevent more than 8 digits.
  */

  manualStudentNumber.addEventListener(
    "input",
    function() {

      this.value =
        this.value
          .replace(/\D/g, "")
          .slice(0, 8);

    }
  );



  // ==================================================
  // SUCCESSFUL SCAN FEEDBACK
  // ==================================================

  function showSuccessfulScan(
    barcode
  ) {

    /*
      Large green confirmation.
    */

    confirmationEl.textContent =
      "✓ " +
      barcode;


    confirmationEl.classList.add(
      "success"
    );



    /*
      Green camera flash.
    */

    scanFlashEl.classList.add(
      "show"
    );


    setTimeout(
      () => {

        scanFlashEl.classList.remove(
          "show"
        );

      },
      160
    );



    /*
      Return to Ready quickly.

      The scanner itself remains running
      throughout this process.
    */

    setTimeout(
      () => {

        confirmationEl.classList.remove(
          "success"
        );


        confirmationEl.textContent =
          "Ready to scan";

      },
      600
    );



    /*
      Vibration where supported.
    */

    if (
      navigator.vibrate
    ) {

      navigator.vibrate(
        80
      );

    }



    /*
      Audible confirmation.
    */

    playBeep();

  }



  // ==================================================
  // RECENT ENTRIES
  // ==================================================

  function addRecentEntry(
    entry
  ) {

    const li =
      document.createElement(
        "li"
      );


    /*
      This identifier exists only on the phone
      so that the recent-entry display can be
      changed from "waiting" to "saved".

      It is NOT sent to Google Sheets.
    */

    const localId =
      "entry-" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .slice(2);


    entry.localId =
      localId;


    li.id =
      localId;


    li.innerHTML =
      "<span>" +
      escapeHtml(
        entry.studentNumber
      ) +
      "</span>" +

      "<span class='waiting'>" +
      escapeHtml(
        entry.method
      ) +
      " · waiting" +
      "</span>";


    recentListEl.prepend(
      li
    );



    /*
      Show only the eight most recent entries.
    */

    while (
      recentListEl.children.length
      > 8
    ) {

      recentListEl.removeChild(
        recentListEl.lastChild
      );

    }


    saveQueueLocally();

  }



  // ==================================================
  // MARK RECENT ENTRY SAVED
  // ==================================================

  function markEntrySaved(
    entry
  ) {

    if (
      !entry.localId
    ) {

      return;

    }


    const li =
      document.getElementById(
        entry.localId
      );


    if (!li) {
      return;
    }


    const status =
      li.querySelector(
        "span:last-child"
      );


    if (status) {

      status.textContent =
        entry.method +
        " · saved ✔";


      status.className =
        "saved";

    }

  }



  // ==================================================
  // BACKGROUND BATCH UPLOAD
  // ==================================================

  async function processUploadQueue() {

    /*
      Only one uploader can operate at
      a time on this phone.
    */

    if (
      uploadInProgress
    ) {

      return;

    }


    if (
      uploadQueue.length === 0
    ) {

      updateQueueStatus();

      return;

    }


    uploadInProgress =
      true;


    try {

      /*
        Keep sending batches until:

        - everything is saved, or
        - a network/server error occurs.
      */

      while (
        uploadQueue.length > 0
      ) {

        /*
          Take up to BATCH_SIZE entries.

          They remain in the real queue until
          Google confirms the write.
        */

        const batch =
          uploadQueue.slice(
            0,
            BATCH_SIZE
          );


        const payloadEntries =
          batch.map(
            entry => ({

              studentNumber:
                entry.studentNumber,

              method:
                entry.method

            })
          );


        try {

          const response =
            await fetch(

              API_URL,

              {

                method:
                  "POST",

                /*
                  IMPORTANT:

                  Do not add:

                  Content-Type: application/json

                  Sending JSON as the plain POST
                  body avoids unnecessary CORS
                  problems with Apps Script.
                */

                body:
                  JSON.stringify({

                    action:
                      "batchSubmit",

                    entries:
                      payloadEntries

                  })

              }

            );



          const data =
            await response.json();



          if (
            !data ||
            !data.ok
          ) {

            throw new Error(
              data?.error ||
              "Server rejected batch"
            );

          }



          const numberSaved =
            Number(
              data.saved || 0
            );



          /*
            Do not remove anything unless Google
            confirms that the entire batch was
            written.
          */

          if (
            numberSaved !==
            batch.length
          ) {

            throw new Error(
              "Server did not confirm full batch"
            );

          }



          /*
            Update recent-entry display.
          */

          for (
            const entry of batch
          ) {

            markEntrySaved(
              entry
            );

          }



          /*
            Google has confirmed the batch.

            Remove those entries from the
            pending queue.
          */

          uploadQueue.splice(
            0,
            batch.length
          );


          savedCount +=
            batch.length;


          saveQueueLocally();


          updateCounters();


          updateQueueStatus();

        }

        catch (error) {

          console.error(
            "Batch upload failed:",
            error
          );


          queueStatusEl.textContent =
            "⚠ " +
            uploadQueue.length +
            " NOT SAVED — retrying";


          queueStatusEl.className =
            "status error";


          updateManualQueueStatus();



          /*
            Nothing is deleted.

            All pending entries stay on the
            phone and will be retried.
          */

          break;

        }

      }

    }

    finally {

      uploadInProgress =
        false;

    }

  }



  // ==================================================
  // AUTOMATIC UPLOAD RETRY
  // ==================================================

  setInterval(
    () => {

      if (
        uploadQueue.length > 0
      ) {

        processUploadQueue();

      }

    },
    RETRY_INTERVAL_MS
  );



  // ==================================================
  // HTML ESCAPING
  // ==================================================

  function escapeHtml(
    value
  ) {

    return String(value)

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );

  }



  // ==================================================
  // INITIALISE
  // ==================================================

  updateCounters();

  updateQueueStatus();



  /*
    If the page was closed or refreshed while
    entries were waiting to upload, recover
    them from localStorage and try again.
  */

  if (
    uploadQueue.length > 0
  ) {

    queueStatusEl.textContent =
      uploadQueue.length +
      (
        uploadQueue.length === 1
          ? " unsaved entry recovered"
          : " unsaved entries recovered"
      );


    queueStatusEl.className =
      "status warning";


    processUploadQueue();

  }

</script>
